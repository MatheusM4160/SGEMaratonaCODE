<!doctype html>
<html>
    <head>
        <title>Estoque - Sistema de Estoque</title>
        <link rel="stylesheet" href="{{ url_for('estoque_bp.static', filename='css/styles.css') }}">
        <link rel="stylesheet" href="{{ url_for('estoque_bp.static', filename='css/adicionar.css') }}">
    </head>
    <body>
        <div class="cabecalho">
            <a href="/fornecedores">
                <button>Fornecedores</button>
            </a>
            <a href="/estoques">
                <button>Estoque</button>
            </a>
            <a href="">
                <button>Compras</button>
            </a>
            <a href="">
                <button>Gastos</button>
            </a>
            <a href="/perfil" id="perfil">
                <img src="{{ url_for('estoque_bp.static', filename='img/perfil.png')}}" alt="Perfil">
            </a>
        </div>
        <hr>
        <div>
            <a href="{{ url_for('estoque_bp.index') }}" class="voltar">Voltar</a>
            <form method="POST" action="{{ url_for('estoque_bp.adicionar_estoque') }}">
                <label for="nome_produto">Nome do Produto:</label>
                <input type="text" id="nome_produto" name="nome_produto" required><br><br>

                <label for="fornecedor_id">Fornecedor:</label>
                <select id="fornecedor_id" name="fornecedor_id" required>
                    {% for fornecedor in fornecedores %}
                        <option value="{{ fornecedor.id }}">{{ fornecedor.nome_fornecedor }}</option>
                    {% endfor %}
                </select><br><br>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" name="quantidade" required><br><br>

                <input type="submit" value="Adicionar Produto">
            </form>
        </div>
    </body>
</html>
